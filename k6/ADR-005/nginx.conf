# ADR-003 앱 2대 앞단 — 라운드 로빈, 업스트림 keepalive. 타임아웃은 k6(30s)보다 길게 두어 nginx가 먼저 끊지 않게.
worker_processes auto;
events { worker_connections 8192; }
http {
  access_log off;
  upstream apps {
    server app:8101;
    server app2:8101;
    keepalive 256;
  }
  server {
    listen 8101;
    location / {
      proxy_pass http://apps;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_next_upstream off;   # 선점은 멱등이 아니다 — 실패한 요청을 다른 앱에 다시 보내지 않는다
    }
  }
}
