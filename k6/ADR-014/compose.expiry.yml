# ADR-014 측정 오버레이(측정-1 · 측정-3.6 '조건 렌더') — k6/ADR-009/compose.yml + compose.tmpfs.yml 위에 얹는다(lb 없음 · 앱 1대 — 측정-1):
#   docker compose -p seatlab -f k6/ADR-009/compose.yml -f k6/ADR-009/compose.tmpfs.yml -f k6/ADR-014/compose.expiry.yml …   (lib14.sh compose14)
#   경로는 첫 파일(k6/ADR-009)의 폴더 기준 — 이 파일은 경로를 쓰지 않는다.
# 사본을 두지 않고 오버레이로 쓰는 이유: db·redis·앱 자원·JVM 옵션·ApplicationName=seatlab-app(대기 표본 by_src의 app 갈래)·tmpfs·서버 측정기(compose.probe.yml)가
#   ADR-009 정의 그대로여야 ADR-009·012·013 결과와 측정 조건이 같다 — 바꾸는 것은 앱 SPRING_APPLICATION_JSON 하나와 이미지 고정뿐이다.
# 앱(app):
#   image = seatlab-app:<APP_TAG>(측정 SHA 8자 — run.sh --prepare-image로 캠페인 전에 한 번 빌드·태그 · 이미지 ID는 plan에 고정 · ADR-013 DS-11 선례) ·
#   build 절을 지우고 pull_policy: never — 회차 안 재빌드·받기 없음(네 방식이 같은 이미지에서 손잡이만 다르다 — 측정-1).
#   SPRING_APPLICATION_JSON을 통째로 바꾼다(ADR-009 compose.yml의 조건 조각은 쓰지 않는다): 만료 방식 손잡이(seat.hold.expiry-mode — Q9) · TTL · 배치 주기 10초(모든 셀) ·
#   좌석 전략(pessimistic-nowait — 기본값과 같다) · 임계 구역 지연 0 · 풀 10 · Flyway 위치(업무 앱 기본 위치 + classpath:db/migration-seat-map — V11 · 모든 셀 같게).
#   카운터 구성 키(counter-drift.* · limit-strategy)는 넣지 않는다 — 업무 앱 기본값 그대로(측정-1 · application.yml:49-61), 적용 값은 configprops로 대조(plan14.py --config-check).
#   변수 기본값은 실패하지 않는 값이다(서버 측정기 기동 `up probe`도 이 파일을 함께 읽는다 — lib.sh probe_server_up) — 잘못 뜬 방식·TTL은 configprops 대조가 잡는다.
services:
  app:
    image: seatlab-app:${APP_TAG:-none}
    pull_policy: never
    build: !reset null
    environment:
      SPRING_APPLICATION_JSON: >-
        {"seat":{"hold":{"expiry-mode":"${EXPIRY_MODE:-sweep}","ttl":"${HOLD_TTL:-5m}","expiry-interval":"${EXPIRY_INTERVAL:-10s}","strategy":"pessimistic-nowait","critical-section-delay":"0s"}},
         "spring":{"datasource":{"hikari":{"maximum-pool-size":${POOL_SIZE:-10}}},
                   "flyway":{"locations":"${FLYWAY_LOCATIONS:-classpath:db/migration}"},
                   "data":{"redis":{"host":"redis","port":6379}}}}
