# ADR-003 측정 환경(ADR-002 기준선 + 경합 제어 전략 · Redis): 앱 + PostgreSQL + Redis. 자원·설정은 전부 환경변수로 주입하고, 결과 폴더에 그 값을 함께 남긴다.
# 실행: docker compose -p seatlab -f k6/ADR-003/compose.yml up -d --build  (repo 루트에서)
# 앱 2대(수평 확장 ⑦): -f k6/ADR-003/compose.yml -f k6/ADR-003/compose.two-apps.yml — 8101은 nginx가 받는다.
name: seatlab

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: seat
      POSTGRES_USER: seat
      POSTGRES_PASSWORD: seat
    ports:
      - "15432:5432"
    cpus: ${DB_CPUS:-2}
    mem_limit: ${DB_MEM:-2g}
    shm_size: 256m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seat -d seat"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Redis는 전략과 무관하게 항상 띄운다 — 전략마다 서버 위 컨테이너 구성이 같도록. 호스트 포트 없음(compose 내부망만).
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    cpus: ${REDIS_CPUS:-1}
    mem_limit: ${REDIS_MEM:-1g}   # redis-nx S4는 TTL 60m 키가 최대 약 197만 개(키당 수백 B) — 512m는 빠듯하다(리뷰 지적)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: loadtest
      DB_URL: jdbc:postgresql://db:5432/seat
      DB_USERNAME: seat
      DB_PASSWORD: seat
      # 설정값은 정확한 속성 이름으로 주입한다 (relaxed binding 추측 배제)
      # 매수 방식은 none 고정(ADR-008 — 앱 기본값이 counter-upsert-precheck로 바뀌었다. 매수 방식이 none이 아니면 좌석 3b 외 전략은 기동 검사에서 거부된다)
      # ADR-009 후보·정리는 끔 고정(ADR-009 결정으로 앱 기본값이 A·C·정리 ① 켬으로 바뀌었다 — 이 하네스는 그 축이 없던 측정이라 이전 기본값 끔을 명시. 카운터 계열이 아닌 매수 방식은 켠 채로는 기동 검사가 거부한다)
      # ADR-012 증분·안전망·탐지 모양도 옛 값 고정(ADR-012 기본값 교체 — 업무 앱 기본값이 증분 trigger 1초 · 안전망 · split · V9 트리거·V10 위치로 바뀌었다. 이 하네스는 그 축이 없던 측정이라 이전 실효 값을 명시)
      SPRING_APPLICATION_JSON: >-
        {"seat":{"hold":{"ttl":"${HOLD_TTL:-5m}","expiry-interval":"${EXPIRY_INTERVAL:-10s}","strategy":"${HOLD_STRATEGY:-none}","limit-strategy":"none","critical-section-delay":"${CRITICAL_SECTION_DELAY:-0s}","counter-drift":{"expiry-repair":false,"reconcile":{"enabled":false,"incremental":{"method":"none","enabled":false},"safety-net":{"enabled":false},"detect-shape":"one-shot"},"cleanup":{"mode":"none"}}}},
         "spring":{"datasource":{"hikari":{"maximum-pool-size":${POOL_SIZE:-10}}},
                   "flyway":{"locations":"${FLYWAY_LOCATIONS:-classpath:db/migration}"},
                   "data":{"redis":{"host":"redis","port":6379}}}}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports:
      - "8101:8101"
    cpus: ${APP_CPUS:-2}
    mem_limit: ${APP_MEM:-1g}

volumes:
  pgdata:
