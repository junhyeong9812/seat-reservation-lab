# ADR-007 측정 환경(ADR-006 compose 복사 + DB 설정 축 — 아래 db.command): 앱 + PostgreSQL + Redis. 자원·설정은 전부 환경변수로 주입하고, 결과 폴더에 그 값을 함께 남긴다.
# 실행: docker compose -p seatlab -f k6/ADR-007/compose.yml up -d --build  (repo 루트에서)
# 좌석 전략 기본 = pessimistic-nowait(ADR-003 결정 3b, 앱 기본값과 같다) · 매수 방식 SEAT_HOLD_LIMIT_STRATEGY(기본 none)
# 앱 2대 오버레이(compose.two-apps.yml)는 ADR-003에서 복사만 했다 — ADR-007 캠페인은 앱 1대만 잰다.
name: seatlab

services:
  db:
    image: postgres:16
    # ADR-006 서버 I/O 지표: pg_stat_wal의 wal_write_time·wal_sync_time(track_wal_io_timing)과 pg_stat_io의 *_time(track_io_timing)은
    # 기본값 off면 0만 나온다 — fsync 평균 시간을 내려고 켠다. 서버 clocksource = tsc(확인 2026-10-09)라 시각 읽기는 vDSO 호출 1회.
    # ADR-005(기본값 off)와 측정 조건이 다르다 — ADR-006 세 방식은 모두 같은 설정이라 캠페인 안 비교는 공정하다(README).
    # ADR-007 설정 축(명세 §2·§9.3 — DB 기동 인자만 바꾼다): 체크포인트 간격·WAL 상한·공유 버퍼. 기본값 = PostgreSQL 16 기본값(5min·1GB·128MB)이라
    # 환경변수를 주지 않으면 ADR-006과 같은 DB다. run.sh --pg-preset이 값을 넘기고, 회차마다 실제 적용값을 SHOW로 읽어 pg-settings.json·meta.json에 남긴다.
    # log_checkpoints는 PG15+ 기본 on이지만 벽 분석(wall.py — 체크포인트 시작·완료 시각)의 근거라 명시한다.
    # shared_buffers는 mmap 익명 공유 메모리라 shm_size(/dev/shm — 병렬 쿼리용 동적 공유 메모리)와 무관하다.
    command: ["postgres", "-c", "track_io_timing=on", "-c", "track_wal_io_timing=on", "-c", "log_checkpoints=on",
              "-c", "checkpoint_timeout=${PG_CHECKPOINT_TIMEOUT:-5min}", "-c", "max_wal_size=${PG_MAX_WAL_SIZE:-1GB}",
              "-c", "shared_buffers=${PG_SHARED_BUFFERS:-128MB}"]
    environment:
      POSTGRES_DB: seat
      POSTGRES_USER: seat
      POSTGRES_PASSWORD: seat
    ports:
      - "15432:5432"
    cpus: ${DB_CPUS:-2}
    mem_limit: ${DB_MEM:-2g}
    shm_size: 256m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seat -d seat"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Redis는 전략과 무관하게 항상 띄운다 — 전략마다 서버 위 컨테이너 구성이 같도록. 호스트 포트 없음(compose 내부망만).
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    cpus: ${REDIS_CPUS:-1}
    mem_limit: ${REDIS_MEM:-1g}   # redis-nx S4는 TTL 60m 키가 최대 약 197만 개(키당 수백 B) — 512m는 빠듯하다(리뷰 지적)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: loadtest
      DB_URL: jdbc:postgresql://db:5432/seat
      DB_USERNAME: seat
      DB_PASSWORD: seat
      # 설정값은 정확한 속성 이름으로 주입한다 (relaxed binding 추측 배제)
      SPRING_APPLICATION_JSON: >-
        {"seat":{"hold":{"ttl":"${HOLD_TTL:-5m}","expiry-interval":"${EXPIRY_INTERVAL:-10s}","strategy":"${HOLD_STRATEGY:-pessimistic-nowait}","limit-strategy":"${SEAT_HOLD_LIMIT_STRATEGY:-none}","critical-section-delay":"${CRITICAL_SECTION_DELAY:-0s}"}},
         "spring":{"datasource":{"hikari":{"maximum-pool-size":${POOL_SIZE:-10}}},
                   "flyway":{"locations":"${FLYWAY_LOCATIONS:-classpath:db/migration}"},
                   "data":{"redis":{"host":"redis","port":6379}}}}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports:
      - "8101:8101"
    cpus: ${APP_CPUS:-2}
    mem_limit: ${APP_MEM:-1g}

volumes:
  pgdata:
