# ADR-009 후보 F — 별도 대조 프로세스(같은 jar, 다른 프로필). 대조만 하고 만료 스케줄러를 끈다(기동 검사가 확인한다).
# 매수 방식 키는 두지 않는다(앱과 같은 기본값·환경 변수를 따른다). DB 접속은 앱과 같은 환경 변수(DB_URL 등).
# ADR-009 기본값 전환(명세 §12)·ADR-012 기본값 교체(명세 §10) 뒤에도 대조 전용 — A·정리·증분·안전망은 아래에서 끈다(전환 전과 같은 F 프로세스).
# 주의(스키마): 이 파일은 Flyway 위치(spring.flyway.locations)·증분 방식(incremental.method)을 두지 않는다 — 키 없이 띄우면 업무 앱 기본값
#   (위치 db/migration + V9 트리거 + V10 · method trigger)을 따라 공유 DB에 V9 트리거·V10을 적용한다. F는 업무 앱과 같은 DB를 쓰므로
#   위치·method는 업무 앱과 같은 값을 줘라(업무 앱이 옛 방식 — 위치 db/migration · method none — 이면 F에도 같은 두 키를 명시).
server:
  port: 8102

seat:
  hold:
    expiry-scheduler-enabled: false
    counter-drift:
      # 대조만 한다 — 앱 기본값(ADR-009 결정 A 켬 · 정리 ① schedule)을 이 프로세스에서는 끈다: 만료를 하지 않으니 A가 할 일이 없고,
      # 정리는 업무 앱이 한다(두 프로세스가 같은 정리를 겹쳐 돌지 않게). A를 끄면 counter-trigger(B)와도 뜬다(A·B 함께 금지 — 기동 검사)
      expiry-repair: false
      # ADR-012 기본값 교체(명세 §10 K8) 뒤에도 F는 C 전체 대조만 — 업무 앱 기본값이 켠 증분·안전망을 끈다(두 프로세스가 같은 대조를 겹쳐 돌지 않게).
      # 방식(incremental.method)·탐지 모양(detect-shape)은 업무 앱 기본값(trigger · split)을 따른다 — 하네스는 F 컨테이너에 method none · 모양을 명시한다
      reconcile:
        enabled: true
        incremental:
          enabled: false
        safety-net:
          enabled: false
      cleanup:
        mode: none
