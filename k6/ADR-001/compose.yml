# ADR-001 측정 환경: 앱 + PostgreSQL. 자원·설정은 전부 환경변수로 주입하고, 결과 폴더에 그 값을 함께 남긴다.
# 실행: docker compose -p seatlab -f k6/ADR-001/compose.yml up -d --build  (repo 루트에서)
name: seatlab

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: seat
      POSTGRES_USER: seat
      POSTGRES_PASSWORD: seat
    ports:
      - "15432:5432"
    cpus: ${DB_CPUS:-2}
    mem_limit: ${DB_MEM:-2g}
    shm_size: 256m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seat -d seat"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: loadtest
      DB_URL: jdbc:postgresql://db:5432/seat
      DB_USERNAME: seat
      DB_PASSWORD: seat
      # 설정값은 정확한 속성 이름으로 주입한다 (relaxed binding 추측 배제)
      # 매수 방식은 none 고정(ADR-008 — 앱 기본값이 counter-upsert-precheck로 바뀌었다. 이 하네스는 매수 축이 없던 측정이라 이전 기본값 none을 명시)
      # ADR-009 후보·정리는 끔 고정(ADR-009 결정으로 앱 기본값이 A·C·정리 ① 켬으로 바뀌었다 — 이 하네스는 그 축이 없던 측정이라 이전 기본값 끔을 명시. 카운터 계열이 아닌 매수 방식은 켠 채로는 기동 검사가 거부한다)
      # ADR-012 증분·안전망·탐지 모양도 옛 값 고정(ADR-012 기본값 교체 — 업무 앱 기본값이 증분 trigger 1초 · 안전망 · split · V9 트리거·V10 위치로 바뀌었다. 이 하네스는 그 축이 없던 측정이라 이전 실효 값을 명시 · Flyway 위치도 이전 기본 classpath:db/migration을 명시)
      SPRING_APPLICATION_JSON: >-
        {"seat":{"hold":{"ttl":"${HOLD_TTL:-5m}","expiry-interval":"${EXPIRY_INTERVAL:-10s}","limit-strategy":"none","counter-drift":{"expiry-repair":false,"reconcile":{"enabled":false,"incremental":{"method":"none","enabled":false},"safety-net":{"enabled":false},"detect-shape":"one-shot"},"cleanup":{"mode":"none"}}}},
         "spring":{"datasource":{"hikari":{"maximum-pool-size":${POOL_SIZE:-10}}},
                   "flyway":{"locations":"classpath:db/migration"}}}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    ports:
      - "8101:8101"
    cpus: ${APP_CPUS:-2}
    mem_limit: ${APP_MEM:-1g}

volumes:
  pgdata:
