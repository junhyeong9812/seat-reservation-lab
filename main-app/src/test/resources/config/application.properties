# ADR-015 §설계-10 T1: 테스트 클래스패스의 모든 기동(@SpringBootTest · SpringApplicationBuilder)에 'test' 프로필을 더한다(include — 각 테스트의 active 프로필은 그대로).
# seat.confirm.unique-index-optional=true는 test · loadtest 프로필에서만 받는다(기동 검사 — HoldStrategyStartupCheck.TEST_PROFILE).
# 시스템 속성이 아니라 파일로 둔다 — Adr012DefaultsContractTest가 '밖의 설정'(시스템 속성 spring.profiles.*)이 없음을 전제로 본다. 이 파일에는 이 키 하나만 둔다.
spring.profiles.include=test
