# ADR-011 서버 측정기(run.sh --probes): seatlab compose 프로젝트 안 k6 컨테이너 하나 — 앱에 직접(http://app:8101 — 같은 compose 네트워크) 초당 PROBE_RATE(50)건
# `GET /actuator`(링크 목록 — scenarios/probe-ping.js, DB를 거치지 않는다). PC 측정기와 같은 시나리오다.
# compose.yml 위에 얹는 오버레이. compose_up(회차 시작)에는 넣지 않는다 — run.sh가 주 k6 직전에 `up -d --no-deps probe`로 이 서비스 하나만 띄우고(lib.sh probe_server_up),
# 주 k6가 끝나면 멈춰(SIGTERM — k6 정상 종료, CSV를 닫는다) /tmp의 CSV를 docker cp로 받은 뒤 지운다(probe_server_collect). compose_down은 늘 이 오버레이까지 지정한다.
# 이미지는 받지 않는다(pull_policy: never) — 측정 중 내려받기가 끼지 않게, 서버에 없으면 기동 실패 = 회차 사유 probe-missing(스모크 전에 한 번 pull).
#   PROBE_IMAGE 기본 grafana/k6:2.2.0(Docker Hub 공식 태그 — 접두어 v 없음. 2026-08-10 게시 · 목록 digest sha256:9bd01d6941fca969cb61bb57d2da5ee9b385fe2aa8881df3798c196564d6ace6)
# 요청 기록 시각은 서버 시계 ms(K6_CSV_TIME_FORMAT=unix_milli) — 분석(scripts/tail.py)이 clock-offset으로 PC 시계로 옮긴다.
# CPU 한도는 1(CFS 한도가 낮으면 측정기 자신이 스로틀로 튈 수 있다 — 50/s에는 넉넉하다)
services:
  probe:
    image: ${PROBE_IMAGE:-grafana/k6:2.2.0}
    pull_policy: never
    command: ["run", "--quiet", "--out", "csv=/tmp/k6-probe-server.csv.gz", "/scenarios/probe-ping.js"]
    environment:
      BASE_URL: http://app:8101
      PROBE_RATE: "${PROBE_RATE:-50}"
      PROBE_DURATION_S: "${PROBE_DURATION_S:-600}"
      K6_CSV_TIME_FORMAT: unix_milli
    volumes:
      - ./scenarios:/scenarios:ro
    cpus: ${PROBE_CPUS:-1}
    mem_limit: ${PROBE_MEM:-512m}
