# ADR-009 후보 F — 별도 대조 프로세스(같은 jar, 다른 프로필). 대조만 하고 만료 스케줄러를 끈다(기동 검사가 확인한다).
# 매수 방식 키는 두지 않는다(앱과 같은 기본값·환경 변수를 따른다). DB 접속은 앱과 같은 환경 변수(DB_URL 등).
# ADR-009 기본값 전환(명세 §12) 뒤에도 대조 전용 — A·정리는 아래에서 끈다(전환 전과 같은 F 프로세스).
server:
  port: 8102

seat:
  hold:
    expiry-scheduler-enabled: false
    counter-drift:
      # 대조만 한다 — 앱 기본값(ADR-009 결정 A 켬 · 정리 ① schedule)을 이 프로세스에서는 끈다: 만료를 하지 않으니 A가 할 일이 없고,
      # 정리는 업무 앱이 한다(두 프로세스가 같은 정리를 겹쳐 돌지 않게). A를 끄면 counter-trigger(B)와도 뜬다(A·B 함께 금지 — 기동 검사)
      expiry-repair: false
      reconcile:
        enabled: true
      cleanup:
        mode: none
