spring:
  application:
    name: seat-reservation-lab
  # 기본값을 두지 않는다 — 로컬 5432의 다른 DB에 실수로 붙지 않게. 로컬 실행은 ./gradlew bootTestRun (Testcontainers)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8101

# actuator는 loadtest 프로필에서만 연다 (application-loadtest.yml)
management:
  # Redis는 Redis 전략에서만 쓴다 — 다른 전략에서 health가 Redis 연결 실패로 DOWN이 되지 않게
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        exclude: "*"

seat:
  hold:
    ttl: 5m
    max-per-user: 2
    expiry-interval: 10s
    # 같은 좌석 경합 제어 방식(ADR-003). 기본 = ADR-003 결정 pessimistic-nowait(none = ADR-000 기준선)
    strategy: pessimistic-nowait
    # 같은 사용자 동시 요청의 매수 제어(ADR-005). 기본 = ADR-008 결정 counter-upsert-precheck(none = 조회 후 비교, ADR-000 기준선)
    limit-strategy: counter-upsert-precheck
    # 임계 구역 지연(ADR-004 실험 장치). 기본 0 = 기준선
    critical-section-delay: 0s
    # 카운터 어긋남 후보·쿼터 행 정리(ADR-009). 기본 = ADR-009 결정(명세 §12) A 켬 · C 켬 · 정리 ① schedule (B·F는 기본 아님)
    # 카운터 계열이 아닌 매수 방식(none·quota·advisory 등)은 세 키를 끄고(false · false · none), counter-trigger(B)는 A를, counter는 정리를 끈다 — 기동 검사가 조합을 거부한다
    counter-drift:
      expiry-repair: true
      reconcile:
        enabled: true
      cleanup:
        mode: schedule
