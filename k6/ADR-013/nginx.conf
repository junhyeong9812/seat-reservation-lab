# ADR-013 lb(§4.6 H2) — ADR-008 nginx.conf 복사 + 구성원 include 파일 · 접근 기록.
#   구성원 = /etc/nginx/members/members.conf(하네스가 넣기·빼기마다 다시 쓰고 nginx -t 통과 뒤에만 reload — lib13.sh lb_members).
#   자리표시 서버(127.0.0.1:9 down)를 늘 둔다 — 구성원이 0인 순간(①의 중단)에도 설정이 성립하고 요청은 곧바로 502(중단으로 센다 · DS-9 ⓐ).
#   reload는 이름을 다시 해석한다(stop/start 뒤 IP가 바뀌어도 맞는 주소 — task 02 실측 위험).
#   접근 기록: $msec(완료 epoch) · $request_time · $upstream_addr · $status — 빼기 뒤 그 앱 주소로 시작한 요청 0 확인(H2 ⓒ · N9). 버퍼 256k · 1초마다 비움.
worker_processes auto;
events { worker_connections 8192; }
http {
  log_format cut '$msec $request_time $upstream_addr $status $request_method $uri';
  access_log /var/log/nginx/cut.log cut buffer=256k flush=1s;
  upstream apps {
    include /etc/nginx/members/members.conf;
    keepalive 256;
  }
  server {
    listen 8101;
    location / {
      proxy_pass http://apps;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_next_upstream off;   # 선점은 멱등이 아니다 — 실패한 요청을 다른 앱에 다시 보내지 않는다(ADR-003)
    }
  }
}
