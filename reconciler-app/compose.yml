# 외부 대조 앱(.158 — ADR-012 §4.2.8). 프로젝트 이름은 늘 `-p seatlab-reconciler`로 준다(하네스 lib.sh external_app_*). 서비스 하나 — DB·Redis 없음(DB = .164:15432).
# 저장소 루트에서: docker compose -p seatlab-reconciler -f reconciler-app/compose.yml up -d --build
# 접속 정보는 이 파일에 값을 쓰지 않는다 — 셸 환경에서만 받는다(없으면 compose가 멈춘다):
#   DB_URL(예 jdbc:postgresql://<.164>:15432/seat?ApplicationName=seatlab-reconciler-ext) · DB_USERNAME · DB_PASSWORD(하네스는 ssh 표준 입력으로 넘긴다 — 인자·파일·이력에 남지 않음)
# 방식·주기·탐지 모양(SPRING_APPLICATION_JSON)만 바꾼다: INC_METHOD(trigger|stmt — 필수, 업무 앱과 같은 값) · INC_INTERVAL(기본 1s) · DETECT_SHAPE(비우면 앱 기본 one-shot) ·
#   INC_TRACK(1이면 track-inject — 효과 셀). 자원 = F와 같은 구성(cpus 1 · mem 1g). JVM 옵션 = F와 같은 꼴(F는 업무 앱 JAVA_TOOL_OPTIONS를 물려받는다 — RECONCILER_JVM_OPTS·2·3·4 = 업무 앱 APP_JVM_OPTS·2·3·4와 같은 값 + MaxRAMPercentage·GC 로그)
services:
  reconciler:
    build:
      context: ..
      dockerfile: reconciler-app/Dockerfile
    image: seatlab-reconciler:${RECONCILER_TAG:-local}
    environment:
      DB_URL: ${DB_URL:?DB_URL가 필요하다}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME가 필요하다}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 필요하다(셸 환경 — 파일에 쓰지 않는다)}
      SPRING_APPLICATION_JSON: >-
        {"seat":{"hold":{${DETECT_SHAPE:+"counter-drift.reconcile.detect-shape":"${DETECT_SHAPE}",}${INC_TRACK:+"counter-drift.reconcile.incremental.track-inject":true,}"counter-drift.reconcile.incremental.method":"${INC_METHOD:?INC_METHOD(trigger|stmt)가 필요하다}","counter-drift.reconcile.incremental.interval":"${INC_INTERVAL:-1s}"}}}
      JAVA_TOOL_OPTIONS: "${RECONCILER_JVM_OPTS:+${RECONCILER_JVM_OPTS} }${RECONCILER_JVM_OPTS2:+${RECONCILER_JVM_OPTS2} }${RECONCILER_JVM_OPTS3:+${RECONCILER_JVM_OPTS3} }${RECONCILER_JVM_OPTS4:+${RECONCILER_JVM_OPTS4} }-XX:MaxRAMPercentage=75 -Xlog:async -Xlog:gc*,safepoint:file=/dev/shm/gc.log:time,uptime,level,tags:filecount=0"
    ports:
      - "8103:8103"
    cpus: ${RECONCILER_CPUS:-1}
    mem_limit: ${RECONCILER_MEM:-1g}
